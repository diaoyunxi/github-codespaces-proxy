name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Linux amd64：构建 + 自测 + 打包 .deb
  # ------------------------------------------------------------------
  linux-amd64:
    name: Linux amd64 (.deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev ca-certificates

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHWP_BUILD_E2E=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run unit + end-to-end tests
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-deb
          path: build/*.deb
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows amd64：构建 exe + 配套 DLL（含运行期依赖）
  # ------------------------------------------------------------------
  windows-amd64:
    name: Windows amd64 (exe + dll)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup vcpkg (OpenSSL, static triplet)
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          if (-not (Test-Path $vcpkgRoot)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          # 静态链接 OpenSSL，避免额外运行期依赖；如需动态 DLL 改成 x64-windows
          & "$vcpkgRoot\vcpkg.exe" install openssl:x64-windows-static
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg integrate install | Out-Null

      - name: Configure (CMake + Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build (exe + dll)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run self tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Collect exe + dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/http-over-wss-server.exe dist/
          Copy-Item build/http-over-wss-client.exe dist/
          Copy-Item build/hwp_core.dll dist/
          # 动态链接时补齐 OpenSSL 运行期 DLL（静态链接时该目录不存在，忽略即可）
          $opensslBin = Join-Path $env:VCPKG_ROOT 'installed/x64-windows/bin'
          if (Test-Path $opensslBin) {
            Copy-Item "$opensslBin\libcrypto-3-x64.dll" dist/ -ErrorAction SilentlyContinue
            Copy-Item "$opensslBin\libssl-3-x64.dll"   dist/ -ErrorAction SilentlyContinue
          }
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath http-over-wss-proxy_win-amd64.zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-exe-dll
          path: |
            dist/*
            http-over-wss-proxy_win-amd64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 发布：打 tag 时把 deb 与 Windows zip 挂到 Release
  # ------------------------------------------------------------------
  release:
    name: Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux-amd64, windows-amd64 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifacts
        run: find artifacts -type f -printf '%p (%s bytes)\n'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-amd64-deb/*.deb
            artifacts/windows-amd64-exe-dll/*.zip
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
